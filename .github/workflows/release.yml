name: 🚀 Auto Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Node.js ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Type check ────────────────────────────────────────────
      - name: Type check
        run: npx tsc --noEmit

      # ── 5. Lint ──────────────────────────────────────────────────
      - name: Lint
        run: npm run lint
        continue-on-error: false          # broken lint = no release

      # ── 6. Run tests (if present) ────────────────────────────────
      - name: Run tests
        run: npm test --if-present

      # ── 7. Build Next.js ─────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          # Add any build-time env vars your Next.js app needs
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production

      # ── 8. Extract version from tag ──────────────────────────────
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── 9. Create GitHub Release ─────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's Changed in ${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](CHANGELOG.md) for full details.

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
