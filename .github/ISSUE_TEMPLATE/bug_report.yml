name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit hash
      placeholder: "e.g. v1.2.3 or abc1234"

  - type: input
    id: os
    attributes:
      label: OS / environment
      placeholder: "e.g. Ubuntu 22.04, macOS 14, Windows 11"

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (crash / data loss)
        - High (major feature broken)
        - Medium (feature partially broken)
        - Low (minor / cosmetic)
    validations:
      required: true
